@if (showShell()) {
  <mat-sidenav-container class="shell">
    <mat-sidenav class="shell-sidenav" mode="side" opened>
      <div class="brand">
        <img src="/bakery-manager-logo.svg" alt="BakeryManager logo" class="brand-logo" />
        <div>
          <div class="brand-name">BakeryManager</div>
          <div class="brand-subtitle">By Abraam Acosta</div>
        </div>
      </div>

      <nav class="nav-panel">
        <a
          *ngFor="let option of options()"
          mat-list-item
          [routerLink]="option.link"
          routerLinkActive="active"
          class="nav-link"
        >
          <mat-icon matListItemIcon>{{ option.icon }}</mat-icon>
          <span matListItemTitle>{{ option.label | translate }}</span>
        </a>
      </nav>

      <button type="button" class="profile-panel" (click)="openProfileSettings()">
        <div class="profile-summary">
          <div class="profile-avatar" aria-label="User avatar">{{ userInitials() }}</div>
          <div class="profile-meta">
            <span class="profile-label">{{ 'profile.user' | translate }}</span>
            <strong>{{ currentUserName || ('profile.default-user' | translate) }}</strong>
          </div>
        </div>
      </button>
    </mat-sidenav>

    <mat-sidenav-content class="shell-content">
      @if (!isProfileRoute()) {
        <header class="shell-header">
          <div>
            <div class="shell-eyebrow">BakeryManager</div>
            <h1>{{ currentSectionLabel() | translate }}</h1>
          </div>
        </header>
      }

      <main class="shell-main" [class.profile-page-main]="isProfileRoute()">
        <router-outlet/>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
} @else {
  <router-outlet/>
}
